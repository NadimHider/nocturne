name: Build H700 (Anbernic RG40XX H)

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (vMAJOR.MINOR.PATCH); leave empty for a development build"
        type: string
        required: false

permissions:
  contents: read

jobs:
  build-h700:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup
        run: make setup

      - name: Build H700
        run: make build PLATFORM=h700 COMPILE_CORES=false
        env:
          PLATFORM: h700

      - name: Package H700 Update
        env:
          NOCTURNE_VERSION: ${{ inputs.version }}
        run: >
          python3 scripts/package_h700.py --commit "$GITHUB_SHA"
          --version "$NOCTURNE_VERSION" --output-dir release_assets

      - name: Upload H700 Update Artifact
        uses: actions/upload-artifact@v4
        with:
          name: h700-update
          path: release_assets/
          if-no-files-found: error

      - name: Upload H700 Boot Payload
        uses: actions/upload-artifact@v4
        with:
          name: h700-boot
          path: workspace/h700/boot/output/dmenu.bin
          if-no-files-found: error
